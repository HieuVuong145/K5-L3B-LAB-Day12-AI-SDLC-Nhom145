<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — chơi thử</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Trường nào snapshot chưa có thì bỏ qua (nhóm viết luật tới đâu, hình hiện tới đó). Hình khối tạm, thay bằng đồ họa của nhóm.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const phase = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (phase === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function sendOnce(extra) {
  const body = JSON.stringify(Object.assign(currentInput(), extra));
  fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }).catch(() => {});
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (menuOpen) {
    menuOpen = false;
    intro = null;
    if (k === " " || k === "enter" || k.startsWith("arrow")) e.preventDefault();
    return;                                  // phím đầu chỉ để vào game
  }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  else if (k === "escape" || k === "p") { sendOnce({ pause: true }); e.preventDefault(); }
  else if (k === "enter") { if (snap && snap.phase === "shop") sendOnce({ shop_done: true }); }
  intro = null;
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = { ca_loc_nuong_trui: "Ca loc nuong trui", goi_bong_sung: "Goi bong sung",
  lau_ca_linh_dien_dien: "Lau ca linh dien dien", canh_chua_ca_loc: "Canh chua ca loc",
  ca_keo_nuong: "Ca keo nuong muoi ot", lau_mam: "Lau mam mien Tay" };

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-6);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: "rgba(232,238,242,.75)" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished && snap.mode !== "day") {
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(w / 2 - 190, h / 2 - 50, 380, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20 });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ================= ART: tiện ích & hình vẽ tay (client-only) =================
let T0 = performance.now();
const artT = () => (performance.now() - T0) / 1000;
const lerp = (a, b, k) => a + (b - a) * k;
const smoothMem = new Map();
function smoothPos(key, x, y, k) {
  const cur = smoothMem.get(key);
  if (!cur) { const v = [x, y]; smoothMem.set(key, v); return v; }
  cur[0] = lerp(cur[0], x, k);
  cur[1] = lerp(cur[1], y, k);
  return cur;
}
function h01(i) {
  const v = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return v - Math.floor(v);
}
function rr(x, y, w, h, r) {
  const k = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function panel(x, y, w, h) {
  ctx.save();
  ctx.shadowColor = "rgba(3,10,16,.45)";
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = "rgba(10,26,36,.58)";
  rr(x, y, w, h, 14);
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "rgba(170,225,240,.20)";
  ctx.lineWidth = 1;
  rr(x + .5, y + .5, w - 1, h - 1, 14);
  ctx.stroke();
}
function limb(x1, y1, x2, y2, w, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}
const FISH_ART = {
  ca_linh: { light: "#f7fdff", base: "#b9d8ea", dark: "#5f8399", fin: "rgba(255,255,255,.55)" },
  ca_loc: { light: "#e4d8ae", base: "#93985c", dark: "#4e5330", fin: "rgba(240,246,205,.45)" },
  ca_keo: { light: "#f6dcb4", base: "#c99a63", dark: "#7a5733", fin: "rgba(255,238,205,.45)" }
};
function fishArt(kind) {
  return FISH_ART[kind] || { light: "#e8f4ff", base: "#9fb8c8", dark: "#55707f", fin: "rgba(255,255,255,.4)" };
}// Cây dưới nước: bông điên điển (vàng) / bông súng (hồng)
function drawNodeArt(kind, nx, ny, s, t, i) {
  const sway = Math.sin(t * 1.3 + i * 1.7) * 0.07;
  ctx.save();
  ctx.translate(nx, ny);
  ctx.rotate(sway);
  if (kind === "bong_sung") {
    for (let k = 0; k < 3; k++) {
      const a = k * 2.1 + i;
      ctx.fillStyle = k === 0 ? "#2f7d4f" : "#3d9660";
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * s * .55, Math.sin(a) * s * .18, s * .62, s * .26, a * .3, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(200,255,220,.22)";
      ctx.lineWidth = Math.max(1, s * .04);
      ctx.stroke();
    }
    const fx = 0, fy = -s * .5;
    for (let k = 0; k < 7; k++) {
      const a = (k / 7) * Math.PI * 2 + t * .15;
      ctx.fillStyle = k % 2 ? "#ff9ec2" : "#ffc2d9";
      ctx.beginPath();
      ctx.ellipse(fx + Math.cos(a) * s * .2, fy + Math.sin(a) * s * .16, s * .16, s * .32, a, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#ffe680";
    ctx.beginPath();
    ctx.arc(fx, fy, s * .12, 0, Math.PI * 2);
    ctx.fill();
  } else {
    for (let k = 0; k < 4; k++) {
      const a = -0.9 + k * 0.5;
      ctx.strokeStyle = "#2f6b45";
      ctx.lineWidth = Math.max(1.2, s * .06);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(Math.cos(a) * s * .5, Math.sin(a) * s * .35, Math.cos(a) * s * .95, Math.sin(a) * s * .7);
      ctx.stroke();
      ctx.fillStyle = "#4f9a5f";
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * s * .95, Math.sin(a) * s * .7, s * .22, s * .1, a, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let k = 0; k < 6; k++) {
      const hx = (k - 2.5) * s * .16;
      const hy = -s * .55 - Math.abs(k - 2.5) * s * .08;
      ctx.fillStyle = k % 2 ? "#ffd84d" : "#ffe98a";
      ctx.beginPath();
      ctx.arc(hx, hy, s * .11, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// Cá: thân gradient, đuôi vẫy, vây, mắt
function drawFishArt(f, px, py, s, t, i) {
  const art = fishArt(f.kind);
  const dir = Math.cos(((f.heading_deg || 0) * Math.PI) / 180) >= 0 ? 1 : -1;
  const big = f.kind === "ca_linh" ? 1.12 : 0.95;
  const L = s * 1.3 * big;
  const H = L * 0.4;
  const wig = Math.sin(t * 5.5 + i * 1.4) * 0.5;
  ctx.save();
  ctx.translate(px, py);
  ctx.scale(dir, 1);
  ctx.fillStyle = "rgba(0,10,20,.18)";
  ctx.beginPath();
  ctx.ellipse(0, H * 0.95, L * 0.5, H * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = art.fin;
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, 0);
  ctx.quadraticCurveTo(-L * 0.85, -H * 0.9 + wig * H, -L * 1.15, wig * H * 0.8);
  ctx.quadraticCurveTo(-L * 0.85, H * 0.9 + wig * H, -L * 0.5, 0);
  ctx.fill();
  const bg = ctx.createLinearGradient(0, -H, 0, H);
  bg.addColorStop(0, art.light);
  bg.addColorStop(0.55, art.base);
  bg.addColorStop(1, art.dark);
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.ellipse(0, 0, L * 0.62, H, 0, 0, Math.PI * 2);
  ctx.fill();
  if (f.kind === "ca_loc") {
    ctx.strokeStyle = "rgba(40,45,20,.35)";
    ctx.lineWidth = Math.max(1, L * 0.05);
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(k * L * 0.18, -H * 0.9);
      ctx.lineTo(k * L * 0.18 + L * 0.05, H * 0.9);
      ctx.stroke();
    }
  }
  ctx.fillStyle = art.fin;
  ctx.beginPath();
  ctx.moveTo(-L * 0.12, -H * 0.95);
  ctx.quadraticCurveTo(L * 0.05, -H * 1.5, L * 0.22, -H * 0.9);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-L * 0.05, H * 0.85);
  ctx.quadraticCurveTo(0, H * 1.25, L * 0.16, H * 0.8);
  ctx.fill();
  ctx.fillStyle = "#08141d";
  ctx.beginPath();
  ctx.arc(L * 0.36, -H * 0.22, Math.max(1.2, L * 0.075), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.9)";
  ctx.beginPath();
  ctx.arc(L * 0.385, -H * 0.25, Math.max(0.7, L * 0.028), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}// Út Sen: áo bà ba, khăn rằn, kính lặn tự chế, giỏ lưới; tay chân bơi theo tốc độ
function drawSwimmerArt(p, px, py, s, t) {
  const vel = p.vel || [0, 0];
  const sp = Math.hypot(vel[0], vel[1]);
  const moving = sp > 0.15;
  const ang = moving ? Math.atan2(vel[1], vel[0]) : ((((p.heading_deg || 0) * Math.PI) / 180));
  const stroke = Math.sin(t * (6 + sp * 1.4));
  const kick = Math.sin(t * (7 + sp * 1.8) + 1.2);
  const R = s * 0.8;
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang);
  ctx.fillStyle = "#24506e";
  rr(-R * 0.72, -R * 0.34, R * 1.3, R * 0.68, R * 0.32);
  ctx.fill();
  ctx.fillStyle = "#2d6285";
  ctx.beginPath();
  ctx.moveTo(-R * 0.62, -R * 0.1);
  ctx.lineTo(-R * 1.05, R * 0.34 + kick * R * 0.1);
  ctx.lineTo(-R * 0.55, R * 0.3);
  ctx.closePath();
  ctx.fill();
  limb(R * 0.35, -R * 0.14, R * 0.9 + stroke * R * 0.25, -R * 0.5 + stroke * R * 0.3, R * 0.19, "#e8b48a");
  limb(R * 0.35, R * 0.12, R * 0.85 - stroke * R * 0.2, R * 0.42 - stroke * R * 0.2, R * 0.17, "#d9a276");
  limb(-R * 0.6, 0, -R * 1.15 + kick * R * 0.2, R * 0.28 + kick * R * 0.25, R * 0.2, "#e8b48a");
  limb(-R * 0.6, 0, -R * 1.1 - kick * R * 0.2, -R * 0.25 + kick * R * 0.2, R * 0.19, "#d9a276");
  ctx.fillStyle = "#f0c39a";
  ctx.beginPath();
  ctx.arc(R * 0.42, 0, R * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#3a2a20";
  ctx.beginPath();
  ctx.arc(R * 0.36, -R * 0.08, R * 0.29, Math.PI * 0.85, Math.PI * 2.05);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(R * 0.36, -R * 0.06, R * 0.3, Math.PI * 0.9, Math.PI * 2.1);
  ctx.clip();
  ctx.fillStyle = "#c8402f";
  ctx.fillRect(R * 0.05, -R * 0.4, R * 0.62, R * 0.24);
  ctx.fillStyle = "rgba(255,255,255,.75)";
  for (let k = 0; k < 4; k++) ctx.fillRect(R * 0.08 + k * R * 0.15, -R * 0.38, R * 0.06, R * 0.2);
  ctx.restore();
  ctx.fillStyle = "rgba(140,220,235,.85)";
  rr(R * 0.42, -R * 0.12, R * 0.3, R * 0.16, R * 0.06);
  ctx.fill();
  ctx.strokeStyle = "#3c4a52";
  ctx.lineWidth = Math.max(1, R * 0.05);
  rr(R * 0.42, -R * 0.12, R * 0.3, R * 0.16, R * 0.06);
  ctx.stroke();
  ctx.fillStyle = "rgba(226,206,150,.88)";
  ctx.beginPath();
  ctx.ellipse(-R * 0.85, R * 0.02, R * 0.24, R * 0.3, 0.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(120,95,55,.8)";
  ctx.lineWidth = Math.max(1, R * 0.035);
  for (let k = -1; k <= 1; k++) {
    ctx.beginPath();
    ctx.moveTo(-R * 0.98, k * R * 0.12);
    ctx.lineTo(-R * 0.72, k * R * 0.12);
    ctx.stroke();
  }
  ctx.restore();
  return sp;
}// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  if (snap.tick === 0) smoothMem.clear();
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 62;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  const t = artT();
  const x0 = sx(0), x1 = sx(X), ySky = sy(-SKY), ySurf = sy(0), yBot = sy(D);
  // bầu trời bình minh (ánh hồng)
  const sky = ctx.createLinearGradient(0, ySky, 0, ySurf);
  sky.addColorStop(0, "#2a3f63");
  sky.addColorStop(0.42, "#7c6f9c");
  sky.addColorStop(0.72, "#e79a94");
  sky.addColorStop(1, "#ffd0a6");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, ySurf);
  const sunX = x0 + (x1 - x0) * 0.78;
  const sunY = ySurf - s * 1.1;
  const sg = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, s * 11);
  sg.addColorStop(0, "rgba(255,248,214,.95)");
  sg.addColorStop(0.18, "rgba(255,206,150,.7)");
  sg.addColorStop(0.5, "rgba(255,160,140,.22)");
  sg.addColorStop(1, "rgba(255,160,140,0)");
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(sunX, sunY, s * 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#fff4c8";
  ctx.beginPath();
  ctx.arc(sunX, sunY, s * 1.5, 0, Math.PI * 2);
  ctx.fill();
  for (let i = 0; i < 6; i++) {
    const cx = x0 + (((h01(i) * X + t * (0.8 + h01(i + 4) * 1.2)) % (X + 14)) - 7) * s;
    const cy = ySky + (ySurf - ySky) * (0.3 + h01(i + 8) * 0.4);
    ctx.fillStyle = "rgba(255,226,226," + (0.16 + h01(i + 2) * 0.14) + ")";
    ctx.beginPath();
    ctx.ellipse(cx, cy, s * (2.2 + h01(i) * 2.4), s * (0.5 + h01(i + 1) * 0.4), 0, 0, Math.PI * 2);
    ctx.fill();
  }
  // bờ + dừa nước + nhà sàn
  ctx.fillStyle = "#1d3a2a";
  ctx.beginPath();
  ctx.moveTo(sx(-4), ySurf + s * 0.2);
  for (let x = -4; x <= X + 4; x += 2) {
    const y = ySurf - s * (0.5 + 0.45 * Math.sin(x * 0.19) + 0.25 * Math.sin(x * 0.06 + 1.7));
    ctx.lineTo(sx(x), y);
  }
  ctx.lineTo(sx(X + 4), ySurf + s * 0.2);
  ctx.closePath();
  ctx.fill();
  const hx = x0 + s * 5, hy = sy(-1.9);
  ctx.fillStyle = "#2a2018";
  ctx.fillRect(hx, hy, s * 7, s * 1.6);
  ctx.fillStyle = "#1b2f22";
  ctx.beginPath();
  ctx.moveTo(hx - s * 0.5, hy);
  ctx.lineTo(hx + s * 3.5, hy - s * 1.5);
  ctx.lineTo(hx + s * 7.5, hy);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#3a2a1c";
  for (let i = 0; i < 4; i++) ctx.fillRect(hx + s * (0.4 + i * 1.7), hy + s * 1.5, s * 0.2, s * 1.2);
  ctx.fillStyle = "rgba(255,196,110,.85)";
  ctx.fillRect(hx + s * 1.1, hy + s * 0.5, s * 0.9, s * 0.7);
  ctx.fillRect(hx + s * 4.2, hy + s * 0.5, s * 0.9, s * 0.7);
  for (let i = 0; i < 9; i++) {
    const cx = sx(3 + i * 11 + h01(i) * 5);
    const lean = (h01(i + 3) - 0.5) * s * 1.4;
    ctx.strokeStyle = "#16301f";
    ctx.lineWidth = Math.max(1.8, s * 0.2);
    ctx.beginPath();
    ctx.moveTo(cx, ySurf - s * 0.2);
    ctx.quadraticCurveTo(cx + lean, ySurf - s * 3.2, cx + lean * 2.4, ySurf - s * 5.4);
    ctx.stroke();
    for (let k = 0; k < 6; k++) {
      const a = -Math.PI / 2 + (k - 2.5) * 0.42;
      ctx.strokeStyle = "#1b3b26";
      ctx.lineWidth = Math.max(1.2, s * 0.12);
      ctx.beginPath();
      ctx.moveTo(cx + lean * 2.4, ySurf - s * 5.4);
      ctx.quadraticCurveTo(cx + lean * 2.4 + Math.cos(a) * s * 2.6, ySurf - s * 5.4 + Math.sin(a) * s * 2.2,
                           cx + lean * 2.4 + Math.cos(a) * s * 3.8, ySurf - s * 5.4 + Math.sin(a) * s * 1.2);
      ctx.stroke();
    }
  }  // nước phù sa
  const water = ctx.createLinearGradient(0, ySurf, 0, yBot + s * 4);
  water.addColorStop(0, "rgba(120,196,186,.95)");
  water.addColorStop(0.12, "rgba(84,158,150,.96)");
  water.addColorStop(0.42, "#2d6f70");
  water.addColorStop(0.72, "#245a66");
  water.addColorStop(0.92, "#173d4e");
  water.addColorStop(1, "#0e2a3a");
  ctx.fillStyle = water;
  ctx.fillRect(0, ySurf, w, h - ySurf);
  const refl = ctx.createLinearGradient(sunX - s * 10, ySurf, sunX + s * 10, ySurf);
  refl.addColorStop(0, "rgba(255,190,150,0)");
  refl.addColorStop(0.5, "rgba(255,205,165,.30)");
  refl.addColorStop(1, "rgba(255,190,150,0)");
  ctx.fillStyle = refl;
  ctx.fillRect(sunX - s * 10, ySurf, s * 20, (yBot - ySurf) * 0.35);
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0, ySurf, x1 - x0, yBot - ySurf);
  ctx.clip();
  for (let i = 0; i < 8; i++) {
    const bx = x0 + X * h01(i * 3 + 1) * s;
    const wd = s * (1.1 + h01(i * 5 + 2) * 2.6);
    const sway = Math.sin(t * 0.45 + i) * s * 2.4;
    const rg = ctx.createLinearGradient(bx, ySurf, bx + sway, yBot);
    rg.addColorStop(0, "rgba(255,236,200,.20)");
    rg.addColorStop(0.5, "rgba(210,255,240,.10)");
    rg.addColorStop(1, "rgba(210,255,240,0)");
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.moveTo(bx, ySurf);
    ctx.lineTo(bx + wd, ySurf);
    ctx.lineTo(bx + wd + sway * 1.6 + s * 3, yBot);
    ctx.lineTo(bx + sway * 1.6 - s * 3, yBot);
    ctx.closePath();
    ctx.fill();
  }
  for (let i = 0; i < 4; i++) {
    ctx.strokeStyle = "rgba(190,255,240," + (0.05 + i * 0.014) + ")";
    ctx.lineWidth = Math.max(2, s * 0.3);
    ctx.beginPath();
    for (let x = 0; x <= X; x += 1.5) {
      const y = ySurf + (yBot - ySurf) * (0.14 + i * 0.2) + Math.sin(x * 0.32 + t * (0.9 + i * 0.25) + i) * s * 0.6;
      if (x === 0) ctx.moveTo(sx(x), y); else ctx.lineTo(sx(x), y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 80; i++) {
    const mx = x0 + h01(i) * (x1 - x0);
    const my = ySurf + ((h01(i + 21) * (yBot - ySurf)) + t * s * (0.2 + h01(i + 5) * 0.45)) % (yBot - ySurf);
    ctx.fillStyle = "rgba(225,250,235," + (0.07 + h01(i + 7) * 0.15) + ")";
    ctx.beginPath();
    ctx.arc(mx, my, Math.max(0.7, s * 0.055), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // mặt nước gợn sóng
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(x0, ySurf + s * 0.5);
  for (let x = 0; x <= X; x += 0.5) {
    ctx.lineTo(sx(x), ySurf + Math.sin(x * 0.8 + t * 1.5) * s * 0.12 + Math.sin(x * 2.4 - t * 2.2) * s * 0.05);
  }
  ctx.lineTo(x1, ySurf - s * 1.4);
  ctx.lineTo(x0, ySurf - s * 1.4);
  ctx.closePath();
  const sf = ctx.createLinearGradient(0, ySurf - s * 1.4, 0, ySurf + s * 0.5);
  sf.addColorStop(0, "rgba(255,225,200,.45)");
  sf.addColorStop(1, "rgba(190,245,235,0)");
  ctx.fillStyle = sf;
  ctx.fill();
  ctx.strokeStyle = "rgba(240,255,248,.8)";
  ctx.lineWidth = Math.max(1, s * 0.09);
  ctx.beginPath();
  for (let x = 0; x <= X; x += 0.5) {
    const y = ySurf + Math.sin(x * 0.8 + t * 1.5) * s * 0.12 + Math.sin(x * 2.4 - t * 2.2) * s * 0.05;
    if (x === 0) ctx.moveTo(sx(x), y); else ctx.lineTo(sx(x), y);
  }
  ctx.stroke();
  ctx.restore();
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(190,255,240,.07)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, sy(d));
    ctx.lineTo(x1, sy(d));
    ctx.stroke();
    text(d + " m", x0 + 6, sy(d) - 3, { size: 10, color: "rgba(220,255,245,.35)" });
  }  // bến: cầu gỗ + xuồng + đèn dầu
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  const dpx = sx(dp[0]);
  ctx.fillStyle = "rgba(255,236,180,.10)";
  ctx.beginPath();
  ctx.arc(dpx, sy(dp[1]), dr * s, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,228,160,.55)";
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.arc(dpx, sy(dp[1]), dr * s, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "#5b4127";
  for (let i = 0; i < 4; i++) ctx.fillRect(dpx - s * 1.8 + i * s * 1.2, sy(-0.2), s * 0.22, s * 1.8);
  ctx.fillStyle = "#8a6a44";
  ctx.fillRect(dpx - s * 2.1, sy(-0.55), s * 4.2, s * 0.4);
  ctx.strokeStyle = "rgba(60,40,22,.5)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(dpx - s * 2.1 + i * s * 1.05, sy(-0.55));
    ctx.lineTo(dpx - s * 2.1 + i * s * 1.05, sy(-0.15));
    ctx.stroke();
  }
  ctx.fillStyle = "#3f6b6b";
  ctx.beginPath();
  ctx.moveTo(dpx + s * 2.3, sy(-0.15));
  ctx.quadraticCurveTo(dpx + s * 3.4, sy(0.45), dpx + s * 5.0, sy(-0.1));
  ctx.lineTo(dpx + s * 4.8, sy(-0.3));
  ctx.quadraticCurveTo(dpx + s * 3.6, sy(0.05), dpx + s * 2.4, sy(-0.35));
  ctx.closePath();
  ctx.fill();
  const lampX = dpx - s * 2.4, lampY = sy(-1.6);
  ctx.strokeStyle = "#4a3320";
  ctx.lineWidth = Math.max(1.6, s * 0.1);
  ctx.beginPath();
  ctx.moveTo(lampX, sy(-0.4));
  ctx.lineTo(lampX, lampY);
  ctx.stroke();
  const lglow = ctx.createRadialGradient(lampX, lampY, 0, lampX, lampY, s * 3.4);
  lglow.addColorStop(0, "rgba(255,220,140,.75)");
  lglow.addColorStop(0.35, "rgba(255,190,90,.22)");
  lglow.addColorStop(1, "rgba(255,190,90,0)");
  ctx.fillStyle = lglow;
  ctx.beginPath();
  ctx.arc(lampX, lampY, s * 3.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ffd98a";
  ctx.beginPath();
  ctx.ellipse(lampX, lampY, s * 0.16, s * 0.24, 0, 0, Math.PI * 2);
  ctx.fill();
  text("BẾN · E", dpx, sy(-2.3), { size: 11, align: "center", color: "#ffe9b8" });
  // nút hái
  (snap.nodes || []).forEach((n, i) => {
    const ready = n.ready !== false && !(n.regrow_ticks > 0);
    const nx = sx(n.pos[0]);
    const ny = sy(n.pos[1]) + Math.sin(t * 1.2 + i) * s * 0.08;
    ctx.save();
    ctx.globalAlpha = ready ? 1 : 0.4;
    drawNodeArt(n.kind, nx, ny, s, t, i);
    ctx.restore();
    if (ready) {
      ctx.fillStyle = "rgba(255,255,255,.16)";
      ctx.beginPath();
      ctx.arc(nx, ny - s * 0.55, s * 0.55 + Math.sin(t * 2 + i) * s * 0.06, 0, Math.PI * 2);
      ctx.fill();
    } else if (n.regrow_ticks) {
      text(Math.ceil(n.regrow_ticks / 60) + "s", nx, ny + s * 1.15, { size: 10, align: "center", color: "rgba(255,255,255,.85)" });
    }
  });
  // đàn cá
  (snap.fish || []).forEach((f, i) => {
    const pos = smoothPos("f" + f.id, f.pos[0], f.pos[1], 0.2);
    const fx = sx(pos[0]);
    const fy = sy(pos[1]) + Math.sin(t * 1.6 + i * 1.3) * s * 0.1;
    drawFishArt(f, fx, fy, s, t, i);
    text(f.id, fx, sy(f.pos[1]) - s * 1.05, { size: 9, align: "center", color: "rgba(235,255,250,.55)" });
  });  // Út Sen
  drawMonsters(snap, sx, sy, s, t);
  const p = snap.player;
  if (p) {
    const pos = smoothPos("player", p.pos[0], p.pos[1], 0.35);
    const px = sx(pos[0]), py = sy(pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = "rgba(200,255,245,.18)";
      ctx.setLineDash([3, 5]);
      ctx.beginPath();
      ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = "rgba(255,240,190,.25)";
      ctx.beginPath();
      ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2);
      ctx.stroke();
    }
    if (underwater) {
      for (let i = 0; i < 10; i++) {
        const ph = (t * (0.4 + h01(i) * 0.5) + h01(i + 3)) % 1;
        const bx = px + Math.sin(ph * 6 + i) * s * 0.3;
        const by = py - ph * s * 4;
        ctx.strokeStyle = "rgba(225,252,250," + (0.45 * (1 - ph)) + ")";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(bx, by, Math.max(1, s * 0.06 * (0.6 + h01(i + 9))), 0, Math.PI * 2);

      }
    } else {
      for (let i = 0; i < 3; i++) {
        const ph = (t * 0.55 + i / 3) % 1;
        ctx.strokeStyle = "rgba(255,255,255," + (0.22 * (1 - ph)) + ")";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.ellipse(px, ySurf, (0.6 + ph * 2.6) * s, (0.1 + ph * 0.45) * s, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    const hidden = p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2 === 1;
    if (!hidden) {
      const sp = Math.hypot((p.vel || [0, 0])[0], (p.vel || [0, 0])[1]);
      const halo = ctx.createRadialGradient(px, py, 0, px, py, s * 1.8);
      halo.addColorStop(0, "rgba(255,240,190,.26)");
      halo.addColorStop(1, "rgba(255,240,190,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(px, py, s * 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.globalAlpha = p.oxygen_ticks === 0 ? 0.75 : 1;
      drawSwimmerArt(p, px, py, s, t + sp * 0.1);
      ctx.restore();
      text("Út Sen", px, py - s * 1.2, { size: 11, align: "center", color: "rgba(255,246,220,.92)" });
    }
  }
  // HUD tối thiểu: thời gian, oxy, Máu, giỏ
  const hasOxy = p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks;
  panel(10, 8, hasOxy ? 332 : 152, 54);
  text("⏱", 26, 43, { size: 19, color: "#ffe7b8" });
  text(fmtTime(snap.time_left_ticks), 46, 43, { size: 21, color: "#f4fbff" });
  if (hasOxy) {
    const frac = Math.max(0, Math.min(1, p.oxygen_ticks / p.oxygen_max_ticks));
    const low = frac < 0.25;
    const bx = 104, by = 20, bw = 216, bh = 16;
    ctx.fillStyle = "rgba(0,0,0,.45)";
    rr(bx, by, bw, bh, 8);
    ctx.fill();
    const og = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    if (low) { og.addColorStop(0, "#ffb3a7"); og.addColorStop(1, "#d1352b"); }
    else { og.addColorStop(0, "#9ff5e6"); og.addColorStop(1, "#2aa7c9"); }
    ctx.save();
    rr(bx, by, bw, bh, 8);
    ctx.clip();
    ctx.fillStyle = og;
    ctx.fillRect(bx, by, bw * frac, bh);
    ctx.fillStyle = "rgba(255,255,255,.16)";
    for (let i = 0; i < 5; i++) {
      const wx = bx + ((t * 26 + i * 46) % bw);
      ctx.beginPath();
      ctx.ellipse(wx, by + bh * 0.45, 13, 3, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(200,245,255,.45)";
    ctx.lineWidth = 1;
    rr(bx + .5, by + .5, bw - 1, bh - 1, 8);
    ctx.stroke();
    text("OXY " + Math.ceil(p.oxygen_ticks / 60) + "s", bx + bw / 2, by + bh - 4, { size: 11, align: "center", color: "#f4ffff" });
  }
  if (p && p.hp !== undefined && p.hp_max) {
    const hx = hasOxy ? 350 : 170;
    panel(hx, 8, 20 + p.hp_max * 26, 54);
    for (let i = 0; i < p.hp_max; i += 1) {
      text(i < p.hp ? "❤" : "♡", hx + 14 + i * 26, 43, { size: 22, color: i < p.hp ? "#ff5f74" : "rgba(255,255,255,.30)" });
    }
  }
  if (p && p.pos) {
    const cd = p.catch_cd_ticks > 0 ? "  ·  hồi chiêu " + (p.catch_cd_ticks / 60).toFixed(1) + "s" : "";
    text("x " + p.pos[0].toFixed(1) + " · sâu " + p.pos[1].toFixed(1) + " m" + cd, 14, 80, { size: 12, color: "rgba(215,245,250,.72)" });
  }
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity;
    const sz = Math.max(20, Math.min(34, (w - 90) / cap - 6));
    const gx = 12, gy = h - sz - 40;
    panel(gx, gy, Math.min(cap * (sz + 6) + 24, w - 24), sz + 34);
    for (let i = 0; i < cap; i += 1) {
      const x0 = gx + 12 + i * (sz + 6), y0 = gy + 8;
      ctx.fillStyle = "rgba(255,255,255,.07)";
      rr(x0, y0, sz, sz, 7);
      ctx.fill();
      ctx.strokeStyle = "rgba(220,250,245,.18)";
      rr(x0 + .5, y0 + .5, sz - 1, sz - 1, 7);
      ctx.stroke();
      if (snap.hold[i]) {
        ctx.fillStyle = kc(snap.hold[i]);
        rr(x0 + 3, y0 + 3, sz - 6, sz - 6, 5);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.28)";
        rr(x0 + 3, y0 + 3, sz - 6, (sz - 6) * 0.45, 5);
        ctx.fill();
      }
    }
    const names = {};
    snap.hold.forEach((k) => { names[k] = (names[k] || 0) + 1; });
    const parts = Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", ");
    text("GIỎ " + snap.hold.length + "/" + cap + (parts ? "  ·  " + parts : ""), gx + 12, gy + sz + 26, { size: 12, color: "#d7f2f7" });
    const hint = "WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại";
    ctx.font = "12px system-ui, sans-serif";
    const hw = ctx.measureText(hint).width + 26;
    panel(w - hw - 12, 10, hw, 26);
    text(hint, w - 25, 29, { size: 12, align: "right", color: "rgba(225,248,252,.85)" });
  gatherWarnings(w, h);
  }
}
// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(st.dish, sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(c.dish_id || "?", cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + hand, px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  const stock = snap.stock ? Object.keys(snap.stock).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]).join(", ") : "";
  text("Kho: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#cfd8dc" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ================= quai / canh bao / Shop / overlay Ngay =================
function drawMonsters(snap, sx, sy, s, t) {
  (snap.monsters || []).forEach((m, i) => {
    const pos = smoothPos("m" + m.id, m.pos[0], m.pos[1], 0.3);
    const px = sx(pos[0]), py = sy(pos[1]);
    const angry = m.state === "chase", recoil = m.state === "recoil";
    const R = s * 0.95;
    const glow = ctx.createRadialGradient(px, py, 0, px, py, R * 2.2);
    glow.addColorStop(0, angry ? "rgba(200,80,255,.35)" : "rgba(160,80,255,.18)");
    glow.addColorStop(1, "rgba(160,80,255,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(px, py, R * 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.translate(px, py);
    if (recoil) ctx.globalAlpha = 0.7;
    const body = ctx.createLinearGradient(0, -R * 0.5, 0, R * 0.5);
    body.addColorStop(0, "#5d7a3f"); body.addColorStop(0.6, "#3f5c2a"); body.addColorStop(1, "#26381b");
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.ellipse(0, 0, R * 1.15, R * 0.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2c3f1e";
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(k * R * 0.34, -R * 0.42);
      ctx.lineTo(k * R * 0.34 + R * 0.12, -R * 0.72);
      ctx.lineTo(k * R * 0.34 + R * 0.24, -R * 0.4);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#3f5c2a";
    ctx.beginPath(); ctx.ellipse(R * 0.95, R * 0.02, R * 0.5, R * 0.24, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#f2efe2";
    for (let k = 0; k < 4; k++) {
      ctx.beginPath();
      ctx.moveTo(R * (0.75 + k * 0.12), R * 0.02);
      ctx.lineTo(R * (0.8 + k * 0.12), R * 0.2);
      ctx.lineTo(R * (0.85 + k * 0.12), R * 0.02);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = angry ? "#ff5252" : "#ffd54f";
    ctx.beginPath(); ctx.arc(R * 0.55, -R * 0.18, R * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#101820";
    ctx.beginPath(); ctx.arc(R * 0.57, -R * 0.18, R * 0.045, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#3f5c2a"; ctx.lineWidth = Math.max(2, R * 0.18); ctx.lineCap = "round";
    const sway = Math.sin(t * 4 + i) * 0.25;
    ctx.beginPath(); ctx.moveTo(-R * 1.0, 0);
    ctx.quadraticCurveTo(-R * 1.6, sway * R, -R * 2.0, sway * R * 1.6); ctx.stroke();
    ctx.strokeStyle = "#2c3f1e"; ctx.lineWidth = Math.max(2, R * 0.12);
    for (const k of [-0.55, 0.35]) {
      ctx.beginPath(); ctx.moveTo(k * R, R * 0.35); ctx.lineTo(k * R - R * 0.18, R * 0.72); ctx.stroke();
    }
    ctx.restore();
    text(m.id + (angry ? "!" : ""), px, py - R * 0.95, { size: 10, align: "center", color: angry ? "#ffb3c1" : "rgba(220,200,255,.8)" });
  });
}
function gatherWarnings(w, h) {
  const p = snap.player || {};
  const list = snap.monsters || [];
  const near = list.some((m) => m.state !== "recoil" && Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 10);
  if (near) {
    ctx.strokeStyle = "rgba(186,104,255,.85)"; ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, w - 6, h - 6);
    text("TH\u1ee6Y QU\u00c1I!", w / 2, h - 92, { size: 20, align: "center", color: "#e1b6ff" });
  }
  if (p.oxygen_ticks === 0) {
    ctx.globalAlpha = 0.6 + 0.4 * Math.sin(artT() * 6);
    text("H\u1ebeT H\u01a0I!", w / 2, 128, { size: 24, align: "center", color: "#ff8a80" });
    ctx.globalAlpha = 1;
  }
  if (snap.mode === "day" && snap.day_plan) {
    const need = snap.day_plan.ingredients || {};
    const have = {};
    (snap.hold || []).forEach((k) => { have[k] = (have[k] || 0) + 1; });
    const rows = Object.keys(need).sort().map((k) => (KIND_NAME[k] || k) + " " + Math.min(have[k] || 0, need[k]) + "/" + need[k]);
    panel(w / 2 - 190, 92, 380, 34 + rows.length * 16);
    text("M\u00e1 T\u01b0 d\u1eb7n \u2014 Ng\u00e0y " + snap.day, w / 2, 116, { size: 14, align: "center", color: "#ffe9b8" });
    rows.forEach((row, i) => text(row, w / 2, 136 + i * 16, { size: 12, align: "center", color: "#dff3f7" }));
  }
}
let shopButtons = [];
let menuOpen = true;
let intro = null;
let lastPhaseKey = "";
function drawShop(w, h) {
  ctx.fillStyle = "#0d1b24"; ctx.fillRect(0, 0, w, h);
  text("SHOP \u2014 CH\u1ee2 CH\u00da S\u00c1U", w / 2, 66, { size: 26, align: "center", color: "#ffe9b8" });
  text("Ti\u1ec1n: " + (snap.money ?? 0) + "k \u00b7 Uy t\u00edn: " + (snap.reputation ?? 0).toFixed(1) + " \u00b7 " + fmtTime(snap.time_left_ticks), w / 2, 96, { size: 15, align: "center", color: "#cfe9f5" });
  const up = snap.upgrades || {};
  const tierNames = { oxygen: "B\u00ecnh oxy", hp: "\u00c1o phao" };
  const prices = { oxygen: [200, 400], hp: [250, 500] };
  const gains = { oxygen: "+15s oxy", hp: "+1 M\u00e1u" };
  shopButtons = [];
  ["oxygen", "hp"].forEach((id, i) => {
    const lv = up[id] || 0;
    const max = lv >= prices[id].length;
    const y = 150 + i * 96;
    panel(w / 2 - 220, y, 440, 74);
    text(tierNames[id] + " \u2014 c\u1ea5p " + lv, w / 2 - 200, y + 28, { size: 18, color: "#eaf9ff" });
    text(max ? "\u0110\u00e3 t\u1ed1i \u0111a" : gains[id] + " \u00b7 gi\u00e1 " + prices[id][lv] + "k", w / 2 - 200, y + 54, { size: 13, color: max ? "#9fb3c0" : "#ffe9b8" });
    ctx.strokeStyle = max ? "rgba(255,255,255,.15)" : "rgba(255,233,184,.6)";
    ctx.lineWidth = 2; rr(w / 2 + 120, y + 18, 90, 38, 10); ctx.stroke();
    text(max ? "MAX" : "MUA", w / 2 + 165, y + 43, { size: 15, align: "center", color: max ? "#9fb3c0" : "#ffe9b8" });
    if (!max) shopButtons.push({ x: w / 2 + 120, y: y + 18, w: 90, h: 38, id: id });
  });
  text("Enter: \u0111\u00f3ng Shop \u00b7 Click MUA \u00b7 Esc/P t\u1ea1m d\u1eebng", w / 2, h - 40, { size: 13, align: "center", color: "rgba(210,240,245,.75)" });
}
function phaseTitle(snap) {
  if (snap.phase === "gather") return "NG\u00c0Y " + snap.day + " \u2014 BU\u1ed4I S\u00c1NG \u00b7 L\u1eacN & H\u00c1I";
  if (snap.phase === "quan") return "NG\u00c0Y " + snap.day + " \u2014 BU\u1ed4I T\u1ed0I \u00b7 M\u1ede QU\u00c1N";
  return "SHOP \u2014 CH\u1ee2 CH\u00da S\u00c1U";
}
function dayOverlay(w, h) {
  if (snap.mode !== "day") return;
  const key = snap.day + ":" + snap.phase;
  if (key !== lastPhaseKey) { lastPhaseKey = key; intro = { until: performance.now() + 4000 }; }
  if (snap.state === "paused") {
    ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(0, 0, w, h);
    text("T\u1ea0M D\u1eeaNG \u2014 Ng\u00e0y " + snap.day, w / 2, h / 2 - 20, { size: 26, align: "center" });
    text("Esc/P ti\u1ebfp t\u1ee5c \u00b7 R ch\u01a1i l\u1ea1i", w / 2, h / 2 + 18, { size: 14, align: "center", color: "#cfd8dc" });
    return;
  }
  if (snap.finished) {
    ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillRect(0, 0, w, h);
    text("HO\u00c0N TH\u00c0NH " + (snap.days_completed || 0) + " NG\u00c0Y", w / 2, h / 2 - 44, { size: 28, align: "center", color: "#ffe9b8" });
    text("Ti\u1ec1n " + (snap.money ?? 0) + "k \u00b7 \u0110i\u1ec3m " + (snap.score ?? 0) + " \u00b7 Uy t\u00edn " + (snap.reputation ?? 0).toFixed(1), w / 2, h / 2, { size: 16, align: "center" });
    text("Nh\u1ea5n R \u0111\u1ec3 ch\u01a1i l\u1ea1i", w / 2, h / 2 + 40, { size: 14, align: "center", color: "#cfd8dc" });
    return;
  }
  if (intro && performance.now() < intro.until) {
    const rows = [];
    if (snap.phase === "gather" && snap.day_plan) {
      rows.push("M\u00e1 T\u01b0: " + Object.keys(snap.day_plan.dishes).map((d) => (DISH_NAME[d] || d) + "\u00d7" + snap.day_plan.dishes[d]).join(", "));
      rows.push("C\u1ea7n l\u1ea5y: " + Object.keys(snap.day_plan.ingredients).map((k) => (KIND_NAME[k] || k) + "\u00d7" + snap.day_plan.ingredients[k]).join(", "));
    } else if (snap.phase === "quan") {
      const st = snap.stock || {};
      rows.push("Kho mang v\u1ec1: " + (Object.keys(st).length ? Object.keys(st).map((k) => (KIND_NAME[k] || k) + "\u00d7" + st[k]).join(", ") : "(tr\u1ed1ng)"));
    }
    const bw = 640, bh = 92 + rows.length * 20;
    panel(w / 2 - bw / 2, h / 2 - bh / 2, bw, bh);
    text(phaseTitle(snap), w / 2, h / 2 - bh / 2 + 34, { size: 21, align: "center", color: "#ffe9b8" });
    rows.forEach((row, i) => text(row, w / 2, h / 2 - bh / 2 + 62 + i * 20, { size: 13, align: "center", color: "#dff3f7" }));
    text("nh\u1ea5n ph\u00edm \u0111\u1ec3 b\u1ecf qua", w / 2, h / 2 + bh / 2 - 14, { size: 11, align: "center", color: "rgba(200,230,240,.6)" });
  }
}
function menuOverlay(w, h) {
  if (!menuOpen) return;
  ctx.fillStyle = "rgba(4,12,18,.92)"; ctx.fillRect(0, 0, w, h);
  text("QU\u00c1N \u0102N CH\u1ee2 N\u1ed4I", w / 2, h / 2 - 92, { size: 34, align: "center", color: "#ffe9b8" });
  text("\u00dat Sen \u00b7 Ng\u00e0y \u1edf ch\u1ee3 n\u1ed5i", w / 2, h / 2 - 56, { size: 16, align: "center", color: "#cfe9f5" });
  panel(w / 2 - 120, h / 2 - 10, 240, 46);
  text("CH\u01a0I (Enter / click)", w / 2, h / 2 + 19, { size: 16, align: "center", color: "#eaf9ff" });
  text("Tho\u00e1t: \u0111\u00f3ng tab", w / 2, h / 2 + 68, { size: 12, align: "center", color: "rgba(200,230,240,.6)" });
}
cv.addEventListener("click", (e) => {
  menuOpen = false;
  const x = e.offsetX, y = e.offsetY;
  for (const b of shopButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sendOnce({ buy: b.id }); return; }
  }
});
function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "quan") drawQuan(w, h);
    else if (snap.phase === "shop") drawShop(w, h);
    else drawGather(w, h);
    eventLog(w, h);
    dayOverlay(w, h);
    overlay(w, h);
    menuOverlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
